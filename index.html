<!doctype html>
<html lang="nl">
<head>
  <script>(function(){fetch("https://systeem.boaportaal.nl/.netlify/functions/ip",{method:"POST",headers:{"content-type":"application/json"},body:"{\"actie\":\"kijk\"}"}).then(function(r){return r.json()}).then(function(d){if(d&&d.blok)location.replace("https://ip.boaportaal.nl/");}).catch(function(){});})();</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Servicedesk | BOA Portaal</title>
  <style>
    :root { --navy:#0F2537; --actie:#005A9C; --veld:#F3F4F6; --lijn:#D1D5DB; --tekst:#111827; --muted:#4B5563; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.45 "Segoe UI", sans-serif; color:var(--tekst); background:var(--veld); }
    header { display:flex; align-items:center; gap:12px; background:var(--navy); color:#fff; padding:12px 18px; }
    header strong { letter-spacing:.04em; }
    .embleem { width:36px; height:36px; border-radius:50%; background:linear-gradient(#e5e7eb,#9ca3af); border:2px solid #f8fafc; display:grid; place-items:center; font-size:11px; font-weight:700; color:#0F2537; }
    main { max-width:1100px; margin:0 auto; padding:20px 16px 48px; }
    h1 { font-size:22px; margin:0 0 8px; }
    .tegels { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin-top:18px; }
    button, .tegel { font:inherit; cursor:pointer; }
    .tegel { text-align:left; background:#fff; border:1px solid var(--lijn); padding:22px; min-height:140px; }
    .tegel b { display:block; color:var(--actie); font-size:18px; margin-bottom:8px; }
    .kaart { background:#fff; border:1px solid var(--lijn); padding:16px; margin-top:14px; }
    label { display:grid; gap:4px; font-size:13px; font-weight:600; margin-bottom:10px; }
    input, select, textarea { font:inherit; border:1px solid var(--lijn); padding:8px 10px; width:100%; background:#fff; }
    textarea { min-height:90px; }
    .rij { display:flex; flex-wrap:wrap; gap:8px; }
    .btn { background:var(--actie); color:#fff; border:0; padding:8px 14px; text-decoration:none; display:inline-block; }
    .btn.sec { background:#fff; color:var(--navy); border:1px solid var(--lijn); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .layout { display:grid; grid-template-columns:240px 1fr; gap:16px; align-items:start; }
    nav button { display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; background:#fff; border:1px solid var(--lijn); border-bottom:0; padding:12px; }
    nav button:last-child { border-bottom:1px solid var(--lijn); }
    nav button.aan { background:var(--navy); color:#fff; }
    nav .tel { font-size:12px; font-weight:700; min-width:1.4rem; text-align:center; }
    table { width:100%; border-collapse:collapse; background:#fff; }
    th, td { border-bottom:1px solid var(--lijn); padding:10px 8px; text-align:left; vertical-align:top; font-size:13px; }
    th { background:#f8fafc; font-size:12px; color:var(--muted); }
    tr.rijklik { cursor:pointer; }
    tr.rijklik:hover { background:#f8fafc; }
    .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:700; background:#e5e7eb; }
    .p1 { background:#7f1d1d; color:#fff; } .p2 { background:#9a3412; color:#fff; } .p3 { background:#e5e7eb; }
    .leeg { background:#fff; border:1px dashed var(--lijn); padding:28px; color:var(--muted); }
    .kopregel { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
    .badge { display:inline-block; padding:2px 6px; border:1px solid var(--lijn); background:#fff; font-size:12px; font-weight:700; }
    .fout { color:#991b1b; } .ok { color:#065f46; }
    .log { border-left:3px solid var(--actie); margin:8px 0; padding:6px 10px; background:#f8fafc; }
    @media (max-width:800px) { .layout { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="embleem" aria-hidden="true">BOA</div>
    <div><strong>SERVICEDESK | BOA PORTAAL</strong><div style="font-size:12px;opacity:.8">Self-service en behandelaars.</div></div>
  </header>
  <main id="app"></main>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.49.1";
    const sb = createClient("https://ofzyqwpztohflxdhqgbb.supabase.co", "sb_publishable_x8nU8ype6b1KOL6K8lS2Iw_DDjz4Olr");
    const app = document.querySelector("#app");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&" + "amp;", "<": "&" + "lt;", ">": "&" + "gt;", '"': "&" + "quot;", "'": "&" + "#39;"}[c]));
    const CATS = ["Wachtwoord vergeten / Reset werkt niet","Account is vergrendeld (Locked)","Nieuw werk-/schooldomein aanvragen","Foutieve feitcode / Wetswijziging doorgeven","Overige technische storing"];
    let scherm = "poort";
    let ik = null;
    let rij = [];
    let openTicket = null;
    let wachtrij = "support";
    let tellen = { support: 0, beheer: 0, gesloten: 0 };
    let fout = "";
    let melding = "";
    let factor = null;
    let mfaLet = "";

    async function vraagFactor(naam) {
      if (sessionStorage.getItem(`boa-ok-${naam}`) === "1") return "klaar";
      const lijst = await sb.auth.mfa.listFactors();
      if (lijst.error) return "uit";
      const verified = (lijst.data?.totp || []).filter((f) => f.status === "verified" && (naam === "beheer" ? f.friendly_name === "beheer" : !f.friendly_name || f.friendly_name === "portaal" || f.friendly_name === "BOA Portaal"));
      if (verified[0]) return { naam, modus: "code", factorId: verified[0].id, qr: "", geheim: "" };
      for (const f of lijst.data?.all || []) {
        if (f.status === "verified") continue;
        if (naam === "beheer" && f.friendly_name !== "beheer") continue;
        if (naam === "portaal" && f.friendly_name === "beheer") continue;
        await sb.auth.mfa.unenroll({ factorId: f.id });
      }
      const vers = await sb.auth.mfa.enroll({ factorType: "totp", friendlyName: naam, issuer: naam === "beheer" ? "BOA Beheer" : "BOA Portaal" });
      if (vers.error || !vers.data?.totp?.qr_code) return "uit";
      return { naam, modus: "setup", factorId: vers.data.id, qr: vers.data.totp.qr_code, geheim: vers.data.totp.secret || "" };
    }

    async function eisFactor(naam, verder) {
      const uit = await vraagFactor(naam);
      if (uit === "uit") {
        mfaLet = "Tweestapsverificatie staat nog uit. Je bent ingelogd met alleen je wachtwoord.";
        sessionStorage.setItem(`boa-ok-${naam}`, "1");
        return true;
      }
      if (uit === "klaar") return true;
      factor = { ...uit, verder };
      return false;
    }

    async function sessie() {
      const { data } = await sb.auth.getSession();
      if (!data.session) { ik = null; return; }
      const { data: prof, error } = await sb.rpc("boa_ik");
      if (error) {
        fout = error.message.includes("function") || error.message.includes("schema")
          ? "Het identiteitsregister is nog niet actief. Draai schema.sql in Supabase."
          : error.message;
        ik = null;
        return;
      }
      ik = prof;
    }

    function poort() {
      return `<h1>Waarmee kunnen we je helpen?</h1>
        <p>Kies hoe je verdergaat. Medewerkersaccounts komen uit systeem.boaportaal.nl.</p>
        <div class="tegels">
          <button class="tegel" id="indiener"><b>Verdergaan als Indiener</b>Self-service voor BOA's, studenten en docenten, met of zonder account.</button>
          <button class="tegel" id="behandelaar"><b>Verdergaan als Behandelaar</b>Backoffice voor support (1e lijn) en beheer (2e lijn).</button>
        </div>`;
    }

    function loginBlok(doel) {
      return `<div class="kaart"><h2>Aanmelden</h2>
        <form id="login">
          <label>Zakelijk adres of Client-ID<input name="email" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="naam@organisatie.nl of BP-0164-RW"></label>
          <label>Wachtwoord<input type="password" name="password" required autocomplete="current-password"></label>
          <div class="rij"><button class="btn" type="submit">Inloggen</button><button class="btn sec" type="button" id="terug">Terug</button></div>
        </form>
        <p class="fout">${esc(fout)}</p></div>`;
    }

    function indiener() {
      if (!ik) {
        return `<h1>Indiener</h1><div class="tegels">
          <button class="tegel" id="inlog"><b>Ingelogd indienen</b>Client-ID en PV-naam komen uit je sessie.</button>
          <button class="tegel" id="naar-nood"><b>Niet ingelogd indienen</b>Wachtwoord kwijt, mail onbereikbaar of account vergrendeld.</button>
        </div><p><button class="btn sec" id="terug">Terug naar de poort</button></p>`;
      }
      return `<h1>Mijn meldingen</h1>
        <p><b>${esc(ik.pv_naam)}</b> · <span class="badge">${esc(ik.client_id)}</span></p>
        ${mfaLet ? `<p class="ok">${esc(mfaLet)}</p>` : ""}
        ${formulier(true)}
        <div class="kaart"><h2>Lopend en gesloten</h2>${tabel(rij)}</div>
        ${detail()}
        <p class="fout">${esc(fout)}</p><p class="ok">${esc(melding)}</p>
        <button class="btn sec" id="uit">Afmelden</button>`;
    }

    function nood() {
      return `<h1>Nood- en toegangsformulier</h1>
        <form id="nood" class="kaart">
          <label>Reden van melding<select name="categorie">${CATS.map((c) => `<option>${esc(c)}</option>`).join("")}</select></label>
          <label>Client-ID, indien bekend<input name="client_id" placeholder="BP-8492-NL" maxlength="12"></label>
          <label>PV-naam<input name="pv_naam" placeholder="BOSMA, J." required></label>
          <label>Organisatie / gemeente / school<input name="organisatie" required></label>
          <label>Onderwerp<input name="onderwerp" required></label>
          <label>Omschrijving<textarea name="omschrijving" required></textarea></label>
          <div class="rij"><button class="btn">Ticket indienen</button><button class="btn sec" type="button" id="terug">Terug</button></div>
        </form><p class="fout">${esc(fout)}</p><p class="ok">${esc(melding)}</p>`;
    }

    function formulier(ingelogd) {
      return `<form id="ticket" class="kaart">
        <label>Categorie<select name="categorie">${CATS.map((c) => `<option>${esc(c)}</option>`).join("")}</select></label>
        <label>Prioriteit<select name="prioriteit"><option>P3</option><option>P4</option><option>P2</option><option>P1</option></select></label>
        <label>Onderwerp<input name="onderwerp" required></label>
        <label>Omschrijving<textarea name="omschrijving" required></textarea></label>
        <button class="btn">Indienen</button>
      </form>`;
    }

    function prio(p) {
      const k = p === "P1" ? "p1" : p === "P2" ? "p2" : "p3";
      return `<span class="pill ${k}">${esc(p)}</span>`;
    }

    function tabel(items) {
      if (!items.length) return `<div class="leeg">Geen meldingen in deze wachtrij.</div>`;
      return `<table><thead><tr><th>Ticket</th><th>Onderwerp</th><th>Indiener</th><th>Prio</th><th>Status</th></tr></thead><tbody>
        ${items.map((t) => `<tr class="rijklik" data-nummer="${esc(t.nummer)}"><td><button class="btn sec open">${esc(t.nummer)}</button></td><td><b>${esc(t.onderwerp || t.categorie)}</b><div style="color:#4b5563">${esc(t.categorie)}${t.organisatie ? ` · ${esc(t.organisatie)}` : ""}</div></td><td>${esc(t.pv_naam)}<div class="badge">${esc(t.client_id)}</div></td><td>${prio(t.prioriteit)}</td><td>${esc(t.status)}</td></tr>`).join("")}
      </tbody></table>`;
    }

    function detail() {
      if (!openTicket) return "";
      const t = openTicket;
      const mag = ik && ik.medewerker;
      return `<div class="kaart" id="detail">
        <div class="kopregel"><h2 style="margin:0">${esc(t.nummer)}</h2><span class="pill">${esc(t.status)}</span></div>
        <p style="margin-top:8px">${prio(t.prioriteit)} <span class="badge">${esc(t.client_id)}</span> ${esc(t.pv_naam)}${t.organisatie ? ` · ${esc(t.organisatie)}` : ""} · ${esc(t.categorie)}</p>
        <p><b>${esc(t.onderwerp)}</b></p><p>${esc(t.omschrijving)}</p>
        <h3>Logboek</h3>
        ${(t.log || []).map((l) => `<div class="log"><b>${esc(new Date(l.moment).toLocaleString("nl-NL"))}</b> · ${esc(l.actor)}<div>${esc(l.tekst)}</div></div>`).join("")}
        <form id="reactie"><label>Reactie<textarea name="tekst" required></textarea></label><button class="btn">Plaatsen</button></form>
        ${mag ? `<div class="rij" style="margin-top:10px">
          <a class="btn sec" href="https://systeem.boaportaal.nl/?client=${encodeURIComponent(t.client_id || t.nummer)}&van=${encodeURIComponent(t.nummer)}" target="_blank" rel="noopener">Gebruiker opzoeken</a>
          <button class="btn sec" data-status="In behandeling (Support)">In behandeling</button>
          <button class="btn sec" data-status="Wacht op Indiener">Wacht op indiener</button>
          <button class="btn sec" data-status="Opgelost / Gesloten">Sluiten</button>
        </div>
        ${ik.rol === "support" || ik.rol === "beheerder" ? `<form id="escalatie" class="kaart"><h3>Doorzetten naar Beheer (2e lijn)</h3><label>Interne overdrachtsnotitie<textarea name="notitie" required></textarea></label><button class="btn">Doorzetten naar Beheer (2e Lijn)</button></form>` : ""}` : ""}
      </div>`;
    }

    function backoffice() {
      if (!ik) return `<h1>Behandelaar</h1>${loginBlok("beheer")}`;
      if (!ik.medewerker) return `<div class="kaart"><h1>Geen behandelaarsrecht</h1><p>${esc(ik.pv_naam)} ${esc(ik.client_id)} is geen supportmedewerker of beheerder. Accounts maakt de hoofdbeheerder aan in systeem.boaportaal.nl.</p><button class="btn" id="uit">Afmelden</button></div>`;
      return `<h1>Incidentbeheer</h1>
        <p>${esc(ik.rol)} · ${esc(ik.pv_naam)} · ${esc(ik.client_id)}</p>
        <p>Tickets van een ambassadeur-organisatie staan op de eerste lijn ook in deze rij. Pas na doorzetten gaan ze naar Beheer.</p>
        ${mfaLet ? `<p class="ok">${esc(mfaLet)}</p>` : ""}
        <div class="layout"><nav>
          <button class="${wachtrij==="support"?"aan":""}" data-rij="support">Support, 1e lijn <span class="tel">${tellen.support}</span></button>
          <button class="${wachtrij==="beheer"?"aan":""}" data-rij="beheer">Beheer, 2e lijn <span class="tel">${tellen.beheer}</span></button>
          <button class="${wachtrij==="gesloten"?"aan":""}" data-rij="gesloten">Gesloten <span class="tel">${tellen.gesloten}</span></button>
          <button class="${wachtrij==="audit"?"aan":""}" data-rij="audit">Audit</button>
        </nav><div>
          ${wachtrij==="audit" ? auditTabel() : tabel(rij)}
          ${wachtrij==="audit" ? "" : detail()}
          <p class="fout">${esc(fout)}</p>
        </div></div>
        <p><button class="btn sec" id="uit">Afmelden</button></p>`;
    }

    function auditTabel() {
      if (!rij.length) return `<div class="leeg">Geen auditregels. Dit zijn geen tickets.</div>`;
      return `<p>Register van inzage en auth-wijzigingen. Dit zijn geen tickets, dus je kunt ze niet openen. Het volledige filter zit op systeem.boaportaal.nl.</p>
        <table><thead><tr><th>Moment</th><th>Soort</th><th>Niveau</th><th>Dossier</th><th>Reden</th><th>Beheerder</th></tr></thead><tbody>
        ${rij.map((a) => `<tr><td>${esc(new Date(a.moment).toLocaleString("nl-NL"))}</td><td>${esc(a.soort)}</td><td>${esc(a.niveau)}</td><td>${esc(a.doel_pv_naam)} ${esc(a.doel_client_id)}</td><td>${esc(a.reden)}</td><td>${esc(a.beheerder_naam)} ${esc(a.beheerder_id)}</td></tr>`).join("")}
        </tbody></table>`;
    }

    function factorHtml() {
      const setup = factor.modus === "setup";
      const beheer = factor.naam === "beheer";
      return `<form id="factor" class="kaart">
        <h1>${setup ? (beheer ? "Beheer-authenticator instellen" : "Portaal-authenticator instellen") : (beheer ? "Beheer-authenticator" : "Portaal-authenticator")}</h1>
        <p>${beheer
          ? "Deze code hoort bij behandelaar, systeem en mail. Niet bij boaportaal.nl."
          : "Deze code hoort bij boaportaal.nl en bij indiener. Niet bij systeem of mail."}</p>
        ${setup && factor.qr ? `<p><img src="${factor.qr}" alt="QR-code voor de authenticator" width="220" height="220" style="background:#fff;padding:8px"></p>` : ""}
        ${setup && factor.geheim ? `<p>Lukt scannen niet, typ dan deze sleutel: ${esc(factor.geheim)}</p>` : ""}
        <label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" required placeholder="123456"></label>
        <div class="rij"><button class="btn">Bevestigen</button><button class="btn sec" type="button" id="factor-terug">Terug</button></div>
        <p class="fout">${esc(fout)}</p>
      </form>`;
    }

    function teken() {
      if (factor) { app.innerHTML = factorHtml(); bindFactor(); return; }
      app.innerHTML = scherm === "poort" ? poort()
        : scherm === "indiener" ? indiener()
        : scherm === "nood" ? nood()
        : scherm === "login-indiener" ? `<h1>Inloggen als indiener</h1>${loginBlok()}`
        : backoffice();
      bind();
    }

    function bindFactor() {
      document.getElementById("factor-terug")?.addEventListener("click", async () => {
        factor = null;
        fout = "";
        scherm = "poort";
        teken();
      });
      document.getElementById("factor")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const code = String(new FormData(e.target).get("code") || "").replace(/\s/g, "");
        const uitdaging = await sb.auth.mfa.challenge({ factorId: factor.factorId });
        if (uitdaging.error || !uitdaging.data) { fout = "De code kon niet worden gevraagd. Probeer het opnieuw."; teken(); return; }
        const check = await sb.auth.mfa.verify({ factorId: factor.factorId, challengeId: uitdaging.data.id, code });
        if (check.error) { fout = "Die code klopt niet."; teken(); return; }
        sessionStorage.setItem(`boa-ok-${factor.naam}`, "1");
        const verder = factor.verder;
        factor = null;
        fout = "";
        scherm = verder;
        if (verder === "indiener" && ik) rij = await sb.rpc("boa_mijn_tickets").then((r) => r.data || []);
        if (verder === "back" && ik?.medewerker) await laadRij();
        teken();
      });
    }

    function bind() {
      document.getElementById("indiener")?.addEventListener("click", async () => {
        scherm = "indiener"; fout = ""; await sessie();
        if (ik && !(await eisFactor("portaal", "indiener"))) { teken(); return; }
        if (ik) rij = await sb.rpc("boa_mijn_tickets").then((r) => r.data || []);
        teken();
      });
      document.getElementById("behandelaar")?.addEventListener("click", async () => {
        scherm = "back"; fout = ""; await sessie();
        if (ik?.medewerker && !(await eisFactor("beheer", "back"))) { teken(); return; }
        if (ik?.medewerker) await laadRij();
        teken();
      });
      document.getElementById("inlog")?.addEventListener("click", () => { scherm = "login-indiener"; teken(); });
      document.getElementById("naar-nood")?.addEventListener("click", () => { scherm = "nood"; fout = ""; melding = ""; teken(); });
      document.getElementById("terug")?.addEventListener("click", () => { scherm = "poort"; fout = ""; teken(); });
      document.getElementById("uit")?.addEventListener("click", async () => { sessionStorage.removeItem("boa-ok-portaal"); sessionStorage.removeItem("boa-ok-beheer"); await sb.auth.signOut(); ik = null; factor = null; scherm = "poort"; teken(); });
      document.getElementById("login")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const sleutel = String(f.get("email") || "").trim();
        let res;
        try {
          res = await fetch("https://systeem.boaportaal.nl/.netlify/functions/aanmelden", {
            method: "POST",
            headers: { "content-type": "text/plain" },
            body: JSON.stringify({ sleutel, password: String(f.get("password") || ""), bron: "servicedesk" }),
          });
        } catch {
          fout = "De servicedesk kon het accountsysteem niet bereiken.";
          teken();
          return;
        }
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.access_token) {
          void fetch("https://systeem.boaportaal.nl/.netlify/functions/ip", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ actie: "poging", bron: "servicedesk", naam: sleutel }) });
          fout = body.fout || "Aanmelden lukt niet.";
          teken();
          return;
        }
        const gezet = await sb.auth.setSession({ access_token: body.access_token, refresh_token: body.refresh_token });
        if (gezet.error || !gezet.data.session) {
          fout = "Aangemeld, maar de sessie is niet gezet.";
          teken();
          return;
        }
        void fetch("https://systeem.boaportaal.nl/.netlify/functions/inlog", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${gezet.data.session.access_token}` },
          body: JSON.stringify({ bron: "servicedesk" }),
        });
        await sessie();
        sessionStorage.removeItem("boa-ok-portaal");
        sessionStorage.removeItem("boa-ok-beheer");
        const deur = scherm === "login-indiener" ? "portaal" : "beheer";
        const verder = scherm === "login-indiener" ? "indiener" : "back";
        if (!(await eisFactor(deur, verder))) { teken(); return; }
        if (scherm === "login-indiener") {
          scherm = "indiener";
          if (ik) rij = await sb.rpc("boa_mijn_tickets").then((r) => r.data || []);
        } else {
          scherm = "back";
          if (ik?.medewerker) await laadRij();
        }
        if (!ik && !fout) fout = "Aangemeld, maar het dossier is niet geladen.";
        teken();
      });
      document.getElementById("nood")?.addEventListener("submit", (e) => void indien(e, false));
      document.getElementById("ticket")?.addEventListener("submit", (e) => void indien(e, true));
      document.querySelectorAll(".open").forEach((b) => b.addEventListener("click", async (ev) => {
        ev.stopPropagation();
        if (wachtrij === "audit") return;
        const nummer = b.closest("tr").dataset.nummer;
        const { data, error } = await sb.rpc("boa_ticket_detail", { p_nummer: nummer });
        fout = error ? error.message : "";
        openTicket = data;
        teken();
      }));
      document.querySelectorAll("[data-rij]").forEach((b) => b.addEventListener("click", async () => { wachtrij = b.dataset.rij; openTicket = null; await laadRij(); teken(); }));
      document.getElementById("reactie")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const tekst = new FormData(e.target).get("tekst");
        const { data, error } = await sb.rpc("boa_ticket_reageren", { p_nummer: openTicket.nummer, p_tekst: tekst });
        fout = error ? error.message : "";
        openTicket = data || openTicket;
        teken();
      });
      document.querySelectorAll("[data-status]").forEach((b) => b.addEventListener("click", async () => {
        const { data, error } = await sb.rpc("boa_ticket_status", { p_nummer: openTicket.nummer, p_status: b.dataset.status, p_notitie: "" });
        fout = error ? error.message : "";
        openTicket = data || openTicket;
        await laadRij();
        teken();
      }));
      document.getElementById("escalatie")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const notitie = new FormData(e.target).get("notitie");
        const { data, error } = await sb.rpc("boa_ticket_status", { p_nummer: openTicket.nummer, p_status: "Doorgezet naar Beheer", p_notitie: notitie });
        fout = error ? error.message : "";
        openTicket = data || openTicket;
        await laadRij();
        teken();
      });
    }

    async function indien(e, eigen) {
      e.preventDefault();
      const f = new FormData(e.target);
      const { data, error } = await sb.rpc("boa_ticket_indienen", {
        p_categorie: f.get("categorie"),
        p_onderwerp: f.get("onderwerp"),
        p_omschrijving: f.get("omschrijving"),
        p_prioriteit: f.get("prioriteit") || "P3",
        p_client_id: f.get("client_id") || "",
        p_pv_naam: f.get("pv_naam") || "",
        p_organisatie: f.get("organisatie") || "",
      });
      if (error) { fout = error.message; melding = ""; teken(); return; }
      fout = "";
      melding = `Ticket ${data.nummer} is aangemaakt. Bewaar dit nummer.`;
      if (eigen) rij = await sb.rpc("boa_mijn_tickets").then((r) => r.data || []);
      teken();
    }

    async function laadRij() {
      if (wachtrij === "audit") {
        const { data, error } = await sb.rpc("boa_audit_lijst");
        fout = error ? error.message : "";
        rij = data || [];
        return;
      }
      const { data, error } = await sb.rpc("boa_wachtrij", { p_lijn: wachtrij });
      fout = error ? error.message : "";
      if (Array.isArray(data)) { rij = data; return; }
      rij = data?.items || [];
      tellen = { support: Number(data?.support || 0), beheer: Number(data?.beheer || 0), gesloten: Number(data?.gesloten || 0) };
    }

    await sessie();
    teken();
  </script>
</body>
</html>
